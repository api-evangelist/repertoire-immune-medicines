aid: repertoire-immune-medicines
name: Repertoire Immune Medicines
description: 'Repertoire Immune Medicines is a Cambridge, Massachusetts biotechnology company
  (with a site in Schlieren, Switzerland) building immune medicines grounded in the human
  T cell repertoire. Its proprietary DECODE platform characterizes the immune synapse by
  identifying T cell receptor (TCR) and antigen (peptide-MHC) pairs together with T cell
  function and HLA presentation, and uses that map to rationally design treatments across
  oncology, autoimmune disease, and infectious disease. Backed by Flagship Pioneering and
  SoftBank Vision Fund, the company was surfaced as a portfolio company and added to the
  API Evangelist network for enrichment. It publishes no public developer API; its only
  public technical surface is a small research GitHub organization.'
